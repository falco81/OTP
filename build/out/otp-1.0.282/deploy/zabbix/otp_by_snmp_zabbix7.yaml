    - uuid: 7aad7c1b6522440995c4f0198bae630f
      name: Clock guard
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.16.2.0]
      key: otp.clock.mode
      delay: 15m
      value_type: CHAR
      trends: '0'
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.16.2.0 (OTP-MIB)'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: clock
    - uuid: d7f1baef51f348cfa1def56f435bed1f
      name: Clock guard holding codes back
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.16.1.0]
      key: otp.clock.engaged
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.16.1.0 (OTP-MIB)'
      valuemap:
        name: 'otp: yes/no'
      tags:
      - tag: component
        value: clock
      triggers:
      - uuid: 2ad0cbdbaa084c1caf8b38dbcc3fa070
        expression: last(/otp by SNMP/otp.clock.engaged)=1
        name: 'otp: The clock guard holds codes back'
        priority: HIGH
        opdata: 'Current: {ITEM.LASTVALUE1}'
        description: 'The clock of this node is not to be trusted: codes are refused until it is (Settings - Time).'
        tags:
        - tag: scope
          value: availability
    - uuid: bac720e26cab4430a92225bf575e0f0e
      name: 'Clock: offset from the time servers'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.16.3.0]
      key: otp.clock.offset
      value_type: FLOAT
      units: s
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.16.3.0 (OTP-MIB)'
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.001'
      tags:
      - tag: component
        value: clock
      triggers:
      - uuid: 6594ee7ad5c2484d90a930a202a248ef
        expression: abs(last(/otp by SNMP/otp.clock.offset))>{$OTP.CLOCK.OFFSET.MAX}/1000
        name: 'otp: The clock is off'
        priority: WARNING
        opdata: 'Current: {ITEM.LASTVALUE1}'
        tags:
        - tag: scope
          value: notice
    - uuid: fd44b53027a34aefa3c3128b2c5214e4
      name: 'Clock: skew from the other node or the directory'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.16.4.0]
