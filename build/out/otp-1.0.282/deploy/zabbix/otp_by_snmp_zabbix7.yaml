        value: cpu
    - uuid: db101f4577c246da960818951aece0b7
      name: CPU utilization
      type: CALCULATED
      key: otp.host.cpu.util
      value_type: FLOAT
      units: '%'
      params: 100*(1-last(//otp.host.cpu.idle.rate)/last(//otp.host.cpu.total.rate))
      description: |
        All cores: the part of the time not idle.
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: f195dfb658af4b4892254c71d2e06191
        expression: min(/otp by SNMP/otp.host.cpu.util,5m)>{$OTP.CPU.UTIL.CRIT}
        name: 'otp: High CPU utilization'
        priority: AVERAGE
        opdata: 'Current: {ITEM.LASTVALUE1}'
        tags:
        - tag: scope
          value: performance
      - uuid: ff8cb64200604d35b34a634a1988eda2
        expression: min(/otp by SNMP/otp.host.cpu.util,5m)>{$OTP.CPU.UTIL.WARN}
        name: 'otp: CPU utilization is rising'
        priority: WARNING
        opdata: 'Current: {ITEM.LASTVALUE1}'
        dependencies:
        - name: 'otp: High CPU utilization'
          expression: min(/otp by SNMP/otp.host.cpu.util,5m)>{$OTP.CPU.UTIL.CRIT}
        tags:
        - tag: scope
          value: performance
