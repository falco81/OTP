zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 2a2a014090d24ed78fcbe524a0db6b2a
    name: Templates/Applications
  templates:
  - uuid: 68b63a815e73467282ffd9c8bf820099
    template: otp by SNMP
    name: otp by SNMP
    description: |-
      otp, the one-time password server (RADIUS): every node by its own SNMPv3 agent (Settings - Monitoring - SNMP).

      The host: an SNMP interface at the node's own address (not the VIP address), SNMPv3, authPriv, the user and both passphrases of the page; link this template. MIB: OTP-MIB (deploy/OTP-MIB.txt in the package).

      Made by otp 1.0.282.
    vendor:
      name: otp
      version: 7.0-282
    groups:
    - name: Templates/Applications
    items:
    - uuid: 9b9438027b364c049f7f0e03752ca41f
      name: Accepted in the last 24 hours
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.2.18.0]
      key: otp.radius.day[accept]
      delay: 5m
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.2.18.0 (OTP-MIB)'
      tags:
      - tag: component
        value: radius
    - uuid: 1a3b36c8918c4fbbaece8ffb9fc3f7c3
      name: 'Backup sent away: age of the newest good one'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.13.7.0]
      key: otp.rbackup.age
      delay: 5m
      value_type: FLOAT
      units: s
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.13.7.0 (OTP-MIB)'
      valuemap:
        name: 'otp: none'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return value == 4294967295 ? -1 : value;'
      tags:
      - tag: component
        value: backup
    - uuid: f461702689c243128f363d34a55c8b63
      name: 'Backup sent away: the newest went'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.13.5.0]
      key: otp.rbackup.ok
      delay: 5m
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.13.5.0 (OTP-MIB)'
      valuemap:
        name: 'otp: ok/failed'
      tags:
      - tag: component
        value: backup
    - uuid: 44aee3589c9049679c35a6a0dfc628a0
      name: Backups sent away
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.13.4.0]
      key: otp.rbackup.on
      delay: 15m
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.13.4.0 (OTP-MIB)'
      valuemap:
        name: 'otp: on/off'
      tags:
      - tag: component
        value: backup
    - uuid: 8faa217004ab4d31bd0c0bdfc16714e5
      name: 'Certificates of the pages: the table'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.8072.9999.9999.7.6.1.1.2,1.3.6.1.4.1.8072.9999.9999.7.6.1.1.3,1.3.6.1.4.1.8072.9999.9999.7.6.1.1.4,1.3.6.1.4.1.8072.9999.9999.7.6.1.1.5]
      key: otp.cert.walk
      delay: 1h
      history: '0'
      value_type: TEXT
      trends: '0'
      description: The table walked; its rows are found by Certificates of the pages.
      tags:
      - tag: component
        value: raw
    - uuid: 59be0c82645f4afeb0e33e129dcb1c15
      name: Challenged in the last 24 hours
