    discovery_rules:
    - uuid: 36e25a6fc93b460993c0ff4fc227aad7
      name: Problems otp sees
      type: DEPENDENT
      key: otp.alert.discovery
      delay: '0'
      description: Each thing otp sees wrong now - a problem of its own while it lasts, gone when it is right.
      master_item:
        key: otp.alert.walk
      lifetime_type: DELETE_IMMEDIATELY
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#SNMPVALUE}'
        - 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.2
        - '0'
        - '{#KEY}'
        - 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.2
        - '0'
        - '{#LEVEL}'
        - 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.3
        - '0'
        - '{#TITLE}'
        - 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.4
        - '0'
        error_handler: DISCARD_VALUE
      item_prototypes:
      - uuid: aa13e06305474f668aa0975f0fae9503
        name: 'Problem [{#KEY}]: level'
        type: DEPENDENT
        key: otp.alert.level[{#KEY}]
        delay: '0'
        value_type: CHAR
        trends: '0'
        description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.3.{#SNMPINDEX} (OTP-MIB)'
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.3.{#SNMPINDEX}
          - '0'
        master_item:
          key: otp.alert.walk
        tags:
        - tag: component
          value: alerts
        trigger_prototypes:
        - uuid: 06eb0115dd2f4d42819eacf01222b282
          expression: find(/otp by SNMP/otp.alert.level[{#KEY}],,"like","bad")=1
          name: 'otp: {#TITLE}'
          priority: HIGH
          description: 'otp sees it (Settings - Alerts): {#KEY}.'
          tags:
          - tag: scope
            value: notice
        - uuid: 69bf5cba93a54ac6b829944b57ee8814
          expression: find(/otp by SNMP/otp.alert.level[{#KEY}],,"like","warn")=1
          name: 'otp: {#TITLE} (warning)'
          priority: WARNING
          description: 'otp sees it (Settings - Alerts): {#KEY}.'
          tags:
          - tag: scope
            value: notice
      - uuid: dfaddb115b2e480fb47774e70d5d7365
        name: 'Problem [{#KEY}]: said'
        type: DEPENDENT
        key: otp.alert.said[{#KEY}]
        delay: '0'
        value_type: TEXT
        trends: '0'
        description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.5.{#SNMPINDEX} (OTP-MIB)'
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.8072.9999.9999.7.5.3.1.5.{#SNMPINDEX}
          - '0'
        master_item:
          key: otp.alert.walk
        tags:
        - tag: component
          value: alerts
    - uuid: 341e914c503d4416899df8f248f382e1
      name: Certificates of the pages
      type: DEPENDENT
      key: otp.cert.discovery
      delay: '0'
      description: Certificates of the pages
      master_item:
        key: otp.cert.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#SNMPVALUE}'
        - 1.3.6.1.4.1.8072.9999.9999.7.6.1.1.2
        - '0'
        - '{#TARGET}'
        - 1.3.6.1.4.1.8072.9999.9999.7.6.1.1.2
        - '0'
        - '{#CN}'
        - 1.3.6.1.4.1.8072.9999.9999.7.6.1.1.3
        - '0'
        error_handler: DISCARD_VALUE
      item_prototypes:
      - uuid: 891ad3360973416bb786d47382a357fb
        name: 'Certificate [{#TARGET}] {#CN}: days left'
        type: DEPENDENT
        key: otp.cert.days[{#TARGET}]
        delay: '0'
        value_type: FLOAT
        units: d
        description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.6.1.1.4.{#SNMPINDEX} (OTP-MIB)'
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.8072.9999.9999.7.6.1.1.4.{#SNMPINDEX}
          - '0'
        master_item:
          key: otp.cert.walk
        tags:
        - tag: component
          value: certificate
        trigger_prototypes:
        - uuid: b086f3af803142ea878c939b605d89f4
          expression: last(/otp by SNMP/otp.cert.days[{#TARGET}])<{$OTP.CERT.EXPIRY.CRIT}
          name: 'otp: Certificate [{#TARGET}] {#CN}: ends within {$OTP.CERT.EXPIRY.CRIT} days'
          priority: HIGH
          opdata: 'Current: {ITEM.LASTVALUE1}'
          tags:
          - tag: scope
            value: notice
        - uuid: fbe9f68fc2184bceb8b19a6ce245c7ee
          expression: last(/otp by SNMP/otp.cert.days[{#TARGET}])<{$OTP.CERT.EXPIRY.WARN}
          name: 'otp: Certificate [{#TARGET}] {#CN}: ends within {$OTP.CERT.EXPIRY.WARN} days'
          priority: WARNING
          opdata: 'Current: {ITEM.LASTVALUE1}'
          dependencies:
          - name: 'otp: Certificate [{#TARGET}] {#CN}: ends within {$OTP.CERT.EXPIRY.CRIT} days'
            expression: last(/otp by SNMP/otp.cert.days[{#TARGET}])<{$OTP.CERT.EXPIRY.CRIT}
          tags:
          - tag: scope
            value: notice
      - uuid: debdfe4549874d46b6890348be9ab69b
