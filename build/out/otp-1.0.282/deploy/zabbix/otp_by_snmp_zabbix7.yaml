    - macro: '{$OTP.NODATA.TIMEOUT}'
      value: 10m
      description: 'No SNMP answer for this long: a problem.'
    - macro: '{$OTP.CPU.UTIL.WARN}'
      value: '80'
      description: CPU utilization (%) for a warning.
    - macro: '{$OTP.CPU.UTIL.CRIT}'
      value: '90'
      description: CPU utilization (%) for a problem.
    - macro: '{$OTP.MEM.UTIL.WARN}'
      value: '90'
      description: Memory utilization (%) for a warning.
    - macro: '{$OTP.FS.PUSED.WARN}'
      value: '85'
      description: 'A file system this full (%): a warning.'
    - macro: '{$OTP.FS.PUSED.CRIT}'
      value: '95'
      description: 'A file system this full (%): a problem.'
    - macro: '{$OTP.FS.INODES.WARN}'
      value: '90'
      description: 'Inodes of a file system used (%): a warning.'
    - macro: '{$OTP.RADIUS.QUEUE.WARN}'
      value: '200'
      description: RADIUS requests waiting for a worker, for 5 minutes.
    - macro: '{$OTP.DB.LATENCY.WARN}'
      value: '0.2'
      description: SELECT 1 taking longer than this (seconds), for 5 minutes.
    - macro: '{$OTP.CERT.EXPIRY.WARN}'
      value: '21'
      description: 'A certificate of the pages ending within this many days: a warning.'
    - macro: '{$OTP.CERT.EXPIRY.CRIT}'
      value: '7'
      description: 'A certificate of the pages ending within this many days: a problem.'
    - macro: '{$OTP.HA.HEARTBEAT.MAX}'
      value: '120'
      description: A node of the cluster not heard from for this long (seconds).
    - macro: '{$OTP.HA.BEHIND.WARN}'
      value: '104857600'
      description: The other node this far behind in taking this node's rows (bytes).
    - macro: '{$OTP.BACKUP.AGE.MAX}'
      value: '129600'
      description: The newest nightly copy older than this (seconds).
    - macro: '{$OTP.RBACKUP.AGE.MAX}'
      value: '129600'
      description: The newest good backup sent away older than this (seconds; 691200 for weekly).
    - macro: '{$OTP.CLOCK.OFFSET.MAX}'
      value: '1000'
      description: This node this far from the time servers (milliseconds).
    - macro: '{$OTP.MAIL.WAITING.MAX}'
      value: '20'
      description: Mail waiting for 30 minutes, at most.
