      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.10.1.0]
      key: otp.host.cpu.idle.rate
      history: 1d
      value_type: FLOAT
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.10.1.0 (OTP-MIB)'
