      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.7.10.2.0]
      key: otp.host.cpu.total.rate
      history: 1d
      value_type: FLOAT
      description: 'OID: 1.3.6.1.4.1.8072.9999.9999.7.10.2.0 (OTP-MIB)'
      preprocessing:
