    valuemaps:
    - uuid: ab6c18b6a919429aafd2acdc04cad233
      name: Host availability status
      mappings:
      - value: '0'
        newvalue: not available
      - value: '1'
        newvalue: available
      - value: '2'
        newvalue: unknown
