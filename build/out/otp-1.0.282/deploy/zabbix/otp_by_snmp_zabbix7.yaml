  triggers:
  - uuid: 66e3b84e96b94b6a8a7510fb5f70f750
    expression: last(/otp by SNMP/otp.backup.nightly)=1 and (last(/otp by SNMP/otp.backup.age)>{$OTP.BACKUP.AGE.MAX} or last(/otp
      by SNMP/otp.backup.age)=-1)
    name: 'otp: No nightly copy of the database'
    priority: WARNING
    opdata: 'Age: {ITEM.LASTVALUE2}'
    tags:
    - tag: scope
      value: availability
  - uuid: 2a3897c10e244247bdf3c514dc318c2d
    expression: last(/otp by SNMP/otp.rbackup.on)=1 and last(/otp by SNMP/otp.rbackup.ok)=0
    name: 'otp: The backup sent away failed'
    priority: HIGH
    tags:
    - tag: scope
      value: availability
  - uuid: 07a50a90dad74463bfffc8ffc0ca159a
    expression: last(/otp by SNMP/otp.rbackup.on)=1 and (last(/otp by SNMP/otp.rbackup.age)>{$OTP.RBACKUP.AGE.MAX} or last(/otp
      by SNMP/otp.rbackup.age)=-1)
    name: 'otp: No backup went away in time'
    priority: WARNING
    opdata: 'Age: {ITEM.LASTVALUE2}'
    tags:
    - tag: scope
      value: availability
    dependencies:
    - name: 'otp: The backup sent away failed'
      expression: last(/otp by SNMP/otp.rbackup.on)=1 and last(/otp by SNMP/otp.rbackup.ok)=0
  - uuid: 8013ecc7000d498fb341666ea92fce4b
    expression: last(/otp by SNMP/otp.signin.cert)=1 and last(/otp by SNMP/otp.crl.bad)>0
    name: 'otp: A CRL of the sign-in with a certificate cannot be had'
    priority: HIGH
    opdata: '{ITEM.LASTVALUE2} CRL(s)'
    description: Nobody signs in with a certificate of its authority until it can (Settings - Accounts, Revocation lists).
    tags:
    - tag: scope
      value: availability
  - uuid: 6bfa68a7f40f4b5788c39b97e4a85bc9
    expression: last(/otp by SNMP/otp.signin.cert)=1 and last(/otp by SNMP/otp.ocsp.mode)<>"off" and last(/otp by SNMP/otp.ocsp.bad)>0
    name: 'otp: An OCSP answer is not good'
    priority: WARNING
    opdata: '{ITEM.LASTVALUE3} answer(s)'
    description: Revoked, unknown, no answer or run out (Settings - Accounts, Online status).
    tags:
    - tag: scope
      value: notice
  - uuid: d02ad5d3de0b40e78df333776b0bc047
    expression: last(/otp by SNMP/otp.logs.on[isemon])=1 and last(/otp by SNMP/otp.logs.trouble[isemon])=1
    name: 'otp: Logs to isemon are in trouble'
    priority: WARNING
    tags:
    - tag: scope
      value: availability
