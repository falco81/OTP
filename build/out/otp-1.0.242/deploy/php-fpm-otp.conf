; /etc/php-fpm.d/otp.conf (on Debian/Ubuntu: /etc/php/<version>/fpm/pool.d/otp.conf)
;
; A pool of otp's own, so that its pages run as an account that may read the
; API token and nothing else - not as whatever every other PHP site on the
; machine runs as. install.sh writes the socket's path and owner for this
; machine into it.
[otp]
user = otp-www
group = otp-www
listen = /run/php-fpm/otp.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 30s
pm.max_requests = 500
; Nothing on otp's pages is ever a form: every request is JSON, read from
; php://input. PHP never takes a body apart here (php2shell), and the
; session upload progress the second flaw goes through is off.
php_admin_flag[enable_post_data_reading] = off
php_admin_value[session.upload_progress.enabled] = 0
php_admin_value[session.use_strict_mode] = 1
php_admin_value[post_max_size] = 4G
php_admin_value[upload_max_filesize] = 1M
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 900
php_admin_flag[allow_url_fopen] = off
php_admin_value[open_basedir] = /var/www/otp:/run/otp:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[expose_php] = off
; What goes wrong is for the log, never for the page: a notice with a path in
; it is a map of the machine to whoever asked for it.
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[html_errors] = off
