; /etc/php.d/99-php2shell.ini (on Debian/Ubuntu: /etc/php/<version>/fpm/conf.d/)
;
; php2shell (CVE-2026-109618, CVE-2026-109619, 21 October 2026). Updating PHP
; is the fix and install.sh does it; these stay as a second layer, for every
; PHP on the machine, early enough to count (a .user.ini is read too late).
; otp's pages need neither upload progress nor sessions.
session.upload_progress.enabled = 0
session.use_strict_mode = 1
