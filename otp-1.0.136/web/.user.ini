; otp's pages, as PHP sees them. The pool in /etc/php-fpm.d/otp.conf says all
; of this already and early enough; this is the same said again for a PHP
; that serves these pages from somewhere else.
enable_post_data_reading = Off
session.upload_progress.enabled = 0
session.use_strict_mode = 1
post_max_size = 4G
upload_max_filesize = 1M
max_execution_time = 900
memory_limit = 128M
; What goes wrong is for the log, never for the page.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
