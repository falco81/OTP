# /etc/rsyslog.d/11-otp.conf - ON THE ISEMON MACHINE, not on the otp server.
#
# otp sends two kinds of line, exactly as a totpcgi token server and the
# FreeRADIUS in front of it do:
#
#   totp.cgi[pid]: Success: user=..., mode=PAM_SM_AUTH, host=..., rid=..., message=...
#   radius-detail[pid]: nas=... id=... file=auth-detail-YYYYMMDD ts=[...] Packet-Type = ...
#
# This files both into the folder named after the host that sent them, as
# the file named after the program - which is where isemon looks:
#
#   /var/log/remote/otp/totp.cgi.log         Settings -> The OTP logs
#   /var/log/remote/otp/radius-detail.log    ...with "RADIUS detail" switched on
#
# "otp" is what otp calls itself unless its setting isemon_hostname says
# otherwise; isemon reads /var/log/remote/otp and /var/log/remote/otpsec by
# default, so a second otp server can call itself otpsec.
#
# A radius-detail line is long. Over UDP rsyslog cuts at 2048 bytes unless
# told otherwise: put   $MaxMessageSize 8192   on the very first line of
# /etc/rsyslog.conf here (before every module), or send over TCP
# (isemon_targets = this-host:514/tcp on the otp side).
#
# After copying:  rsyslogd -N1 && systemctl restart rsyslog

template(name="OptFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

if ($programname == "totp.cgi" or $programname == "radius-detail") then {
    action(type="omfile" dynaFile="OptFile"
           dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="root" dirGroup="isemon"
           fileOwner="root" fileGroup="isemon")
    stop
}

